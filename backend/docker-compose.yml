services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mutatrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"   # 5433 di luar agar tidak bentrok dengan PostgreSQL lokal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mutatrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/mutatrack
      JWT_SECRET: ${JWT_SECRET}
      DATA_DIR: /app/data
      SNPEFF_DB: ${SNPEFF_DB}
      THREADS: ${THREADS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
  appdata:
